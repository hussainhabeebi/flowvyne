name = "flowvyne"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build:ui"

[[d1_databases]]
binding = "DB"
database_name = "flowvyne-db"
database_id = "4422ae79-e1ec-4ab4-83ac-0d546f4b584f"
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"

[[rules]]
type = "ESModule"
globs = ["**/*.ts"]

[assets]
directory = "./ui/dist"
not_found_handling = "single-page-application"

# Leadvyne can call Flowvyne via Service Binding — add this to leadvyne's wrangler.toml:
# [[services]]
# binding = "FLOWVYNE"
# service = "flowvyne"
